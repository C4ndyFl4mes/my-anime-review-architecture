services:
  db:
    image: postgres:14.5
    restart: always
    ports: 
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    secrets:
      - source: postgres_user
        target: postgres_user.txt
      - source: postgres_password
        target: postgres_password.txt
      - source: postgres_db
        target: postgres_db.txt
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user.txt
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password.txt
      POSTGRES_DB_FILE: /run/secrets/postgres_db.txt
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/postgres_user.txt) -d $$(cat /run/secrets/postgres_db.txt)"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    image: caandyflames/my-anime-review-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - source: db_connection_string
        target: db_connection_string.txt
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
  react:
    image: caandyflames/my-anime-review-application:latest
    restart: unless-stopped
    depends_on:
      - api
  caddy:
    image: caddy:alpine
    restart: unless-stopped
    depends_on:
      - api
      - react
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_certs:/config
volumes:
  pgdata:
  caddy_data:
  caddy_certs:
secrets:
  postgres_user:
    file: .secrets/postgres_user.txt
  postgres_password:
    file: .secrets/postgres_password.txt
  postgres_db:
    file: .secrets/postgres_db.txt
  db_connection_string:
    file: .secrets/db_connection_string.txt